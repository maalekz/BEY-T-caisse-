name: TM Print diagnostic
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  run:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build and record result
        run: |
          set +e
          {
            git show 7aff5a038fe493d229fff04a32b88728f4b9f872:index.html > source.html
            python - <<'PY'
          from pathlib import Path
          import re
          s=Path('source.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="text/babel">(.*?)</script>',s,re.S)
          code=m.group(1)
          a=code.index('function doPrint(order){')
          b=code.index('\n}\n\n/* ── Print Z-Report',a)+2
          new='''function xmlEsc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}\nfunction openTMPrintAssistant(xml){window.location.href="tmprintassistant://tmprintassistant.epson.com/print?ver=1&data-type=eposprintxml&data="+encodeURIComponent(xml);}\nfunction doPrint(order){let x='<?xml version="1.0" encoding="utf-8"?><epos-print xmlns="http://www.epson-pos.com/schemas/2011/03/epos-print"><text align="center"/><text em="true" width="2" height="2">BEY-T</text><feed line="2"/>';x+='<text em="false" width="1" height="1">Commande #'+xmlEsc(order.num)+'\\n'+xmlEsc(order.date)+' '+xmlEsc(order.time)+'</text><feed line="2"/><text align="left"/>';order.items.forEach(it=>{x+='<text em="true">'+xmlEsc(it.name)+'</text><feed line="1"/><text>'+xmlEsc(it.qty+' x '+it.price.toFixed(2)+' EUR = '+(it.price*it.qty).toFixed(2)+' EUR')+'</text><feed line="1"/>';if(it.note)x+='<text>'+xmlEsc(it.note)+'</text><feed line="1"/>';});x+='<feed line="1"/><text align="center" em="true" width="2" height="2">TOTAL '+xmlEsc(order.total.toFixed(2))+' EUR</text><feed line="1"/><text em="false" width="1" height="1">'+xmlEsc(order.paymentLabel.replace(/[^\\w\\s]/g,"").trim())+'</text><feed line="2"/><text>Merci ! A bientot chez Bey-T</text><feed line="4"/><cut type="feed"/></epos-print>';openTMPrintAssistant(x);}'''
          code=code[:a]+new+code[b:]
          code=code.replace("CHIFFRE D'AFFAIRES","CHIFFRE D\\'AFFAIRES")
          code=code.replace('const {useState,useEffect,useRef,useCallback}=React;',"import React, {useState,useEffect,useRef,useCallback} from 'react';\nimport {createRoot} from 'react-dom/client';",1).replace('ReactDOM.createRoot(','createRoot(',1)
          Path('app.jsx').write_text(code,encoding='utf-8')
          html=s[:m.start()]+'<script src="./bundle.js?v=tmprint2"></script>'+s[m.end():]
          html=re.sub(r'<script src="https://unpkg.com/react@18/umd/react\.production\.min\.js"></script>\s*','',html)
          html=re.sub(r'<script src="https://unpkg.com/react-dom@18/umd/react-dom\.production\.min\.js"></script>\s*','',html)
          html=re.sub(r'<script src="https://unpkg.com/@babel/standalone/babel\.min\.js"></script>\s*','',html)
          Path('index.html').write_text(html,encoding='utf-8')
          PY
            npm install --no-save react@18 react-dom@18 esbuild
            npx esbuild app.jsx --bundle --minify --format=iife --target=es2020 --outfile=bundle.js
          } > tmprint-build.log 2>&1
          STATUS=$?
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ $STATUS -eq 0 ]; then
            rm -f .github/workflows/tmprint-diagnostic.yml .github/workflows/add-tm-print-assistant.yml .trigger-tmprint .trigger-tmprint-diag app.jsx source.html tmprint-build.log
            git add -A
            git commit -m "Enable Epson Bluetooth receipt printing"
          else
            git add tmprint-build.log
            git commit -m "Record TM Print integration failure"
          fi
          git push
