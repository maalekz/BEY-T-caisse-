name: Fix blank page

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix broken CSV newline
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          bad='const csv="\ufeff"+rows.map(r=>Array.isArray(r)?r.map(Q).join(";"):"").join("\n");'
          good='const csv="\ufeff"+rows.map(r=>Array.isArray(r)?r.map(Q).join(";"):"").join("\\n");'
          if bad not in s:
              raise SystemExit('Target pattern not found')
          p.write_text(s.replace(bad,good,1),encoding='utf-8')
          PY
          rm .github/workflows/fix-index.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-index.yml
          git commit -m "Fix blank page syntax error"
          git push
