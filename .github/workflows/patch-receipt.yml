name: Patch receipt bundle
on:
  push:
    branches: [main]
    paths:
      - 'patch-receipt.cjs'
      - '.github/workflows/patch-receipt.yml'
      - 'README.md'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node patch-receipt.cjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bundle.js
          if git diff --cached --quiet; then
            echo "No bundle change"
          else
            git commit -m "Update printed receipt layout"
            git push
          fi
