name: Restore working v14

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore last known working index
        run: |
          git show 7aff5a038fe493d229fff04a32b88728f4b9f872:index.html > index.html
          rm -f .github/workflows/restore-v14.yml
          rm -f .github/workflows/diagnose-jsx.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/restore-v14.yml .github/workflows/diagnose-jsx.yml
          git commit -m "Restore working v14 index"
          git push
